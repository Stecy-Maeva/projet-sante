{% extends "base.html" %}

{% block content %}
<div class="max-w-3xl mx-auto p-6 bg-white shadow-md rounded-lg">
    <h1 class="text-3xl font-bold text-center mb-6">📊 Tableau de bord</h1>

    <table class="table-auto w-full border">
        <thead class="bg-blue-500 text-white">
            <tr>
                <th class="px-4 py-2">Poids</th>
                <th class="px-4 py-2">IMC</th>
                <th class="px-4 py-2">Fréquence Cardiaque</th>
            </tr>
        </thead>
        <tbody>
            {% for data in donnees %}
            <tr class="border-b">
                <td class="px-4 py-2 text-center">{{ data.poids }} kg</td>
                <td class="px-4 py-2 text-center">{{ data.calcul_imc }}</td>
                <td class="px-4 py-2 text-center">{{ data.frequence_cardiaque }} bpm</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <a href="{% url 'ajouter' %}" class="mt-6 bg-green-500 text-white px-4 py-2 rounded block text-center">➕ Ajouter des données</a>
    <a href="{% url 'analyse' %}" class="mt-2 bg-blue-500 text-white px-4 py-2 rounded block text-center">📈 Analyser</a>
</div>
{% endblock %}
