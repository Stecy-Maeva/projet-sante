<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Inscription</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex justify-center items-center min-h-screen">
  <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
    <h1 class="text-2xl font-bold mb-6 text-center text-green-600">Créer un compte</h1>
    
    <!-- Le formulaire inclut {% csrf_token %} pour que Django insère le token dans le contexte -->
    <form id="registerForm" method="post">
      {% csrf_token %}
      <input type="text" id="registerUsername" placeholder="Nom d'utilisateur" class="w-full p-2 mb-4 border rounded" required />
      <input type="password" id="registerPassword" placeholder="Mot de passe" class="w-full p-2 mb-4 border rounded" required autocomplete="new-password" />
      <button type="submit" class="w-full bg-green-500 text-white p-2 rounded hover:bg-green-600 transition">
        S'inscrire
      </button>
    </form>
    
    <p class="mt-4 text-center">
      Déjà un compte ? <a href="/login" class="text-blue-500 underline">Connecte-toi</a>
    </p>
    
    <p id="responseMsg" class="text-red-500 text-sm mt-4 text-center"></p>
  </div>
  
  <script>
    // Fonction pour récupérer la valeur d'un cookie par son nom
    function getCookie(name) {
      let cookieValue = null;
      if (document.cookie && document.cookie !== "") {
        const cookies = document.cookie.split(";");
        for (let cookie of cookies) {
          cookie = cookie.trim();
          if (cookie.startsWith(name + "=")) {
            cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
            break;
          }
        }
      }
      return cookieValue;
    }
    
    // Récupération dynamique du token CSRF
    const csrftoken = getCookie("csrftoken");
    console.log("CSRF Token récupéré :", csrftoken);
    
    // Gestion de la soumission du formulaire via AJAX
    document.getElementById("registerForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      
      const username = document.getElementById("registerUsername").value;
      const password = document.getElementById("registerPassword").value;
      
      try {
        const response = await fetch("/api/register/", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": csrftoken
          },
          credentials: "include",
          body: JSON.stringify({ username, password })
        });
        
        const data = await response.json().catch(() => ({ message: "Réponse invalide" }));
        const msgEl = document.getElementById("responseMsg");
        msgEl.textContent = data.message;
        
        if (response.ok) {
          msgEl.classList.remove("text-red-500");
          msgEl.classList.add("text-green-500");
          // Redirection vers la page de connexion après 1,5 seconde
          setTimeout(() => window.location.href = "/login", 1500);
        } else {
          msgEl.classList.remove("text-green-500");
          msgEl.classList.add("text-red-500");
        }
      } catch (err) {
        console.error("Erreur JS ou réseau:", err);
        const msgEl = document.getElementById("responseMsg");
        msgEl.textContent = "Erreur de communication avec le serveur.";
        msgEl.classList.remove("text-green-500");
        msgEl.classList.add("text-red-500");
      }
    });
  </script>
</body>
</html>
