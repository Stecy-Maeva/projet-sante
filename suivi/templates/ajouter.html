{% extends "base.html" %}

{% block content %}
<div class="max-w-xl mx-auto p-6 bg-white shadow-md rounded-lg">
    <h1 class="text-3xl font-bold text-center mb-6">Ajouter des données</h1>

    <form method="POST" class="space-y-4">
        {% csrf_token %}

        <label class="block">
            <span class="text-gray-700">Utilisateur</span>
            <select name="user" class="w-full px-4 py-2 border rounded" required>
                {% for utilisateur in utilisateurs %}
                <option value="{{ utilisateur.id }}">{{ utilisateur.username }}</option>
                {% endfor %}
            </select>
        </label>

        <label class="block">
            <span class="text-gray-700">Poids (kg)</span>
            <input name="poids" type="number" min="1" step="0.1" class="w-full px-4 py-2 border rounded" required>
        </label>

        <label class="block">
            <span class="text-gray-700">Taille (m)</span>
            <input name="taille" type="number" step="0.01" min="0.5" max="2.5" class="w-full px-4 py-2 border rounded" required>
        </label>

        <label class="block">
            <span class="text-gray-700">Fréquence Cardiaque (bpm)</span>
            <input name="frequence_cardiaque" type="number" min="30" max="220" class="w-full px-4 py-2 border rounded">
        </label>

        <label class="block">
            <span class="text-gray-700">Pression Artérielle</span>
            <input name="pression_arterielle" type="text" class="w-full px-4 py-2 border rounded">
        </label>

        <button type="submit" class="mt-4 bg-blue-500 text-white px-4 py-2 rounded w-full"> Enregistrer</button>
    </form>
</div>
{% endblock %}
